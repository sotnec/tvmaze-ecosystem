<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TVmaze Cast Inspector</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50 text-slate-800">

  <!-- HEADER & CONTROLS -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <!-- Logo / Title -->
        <div class="flex items-center gap-3">
          <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-sm">
            <i class="fa-solid fa-tv text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-900 leading-tight">TVmaze Cast Inspector</h1>
            <p class="text-xs text-slate-500 font-medium">Audit TV show cast & character data</p>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center gap-2 w-full md:w-auto">
          <div class="relative w-full md:w-80">
            <input 
              type="text" 
              id="searchInput"
              placeholder="Search show title..."
              class="w-full bg-slate-100 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
              onkeyup="if(event.key === 'Enter') executeSearch()"
            />
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
          </div>
          <button 
            onclick="executeSearch()"
            class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm shrink-0">
            Search
          </button>
        </div>

      </div>

      <!-- FILTER CONTROLS BAR -->
      <div class="mt-4 pt-4 border-t border-slate-100 flex flex-wrap items-center gap-3">
        <!-- Language Select -->
        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
          <label for="langSelect" class="text-xs font-semibold text-slate-500">Language:</label>
          <select id="langSelect" onchange="applyFiltersAndReload()" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
            <option value="ALL">All Languages</option>
            <option value="English">English</option>
            <option value="Turkish">Turkish</option>
            <option value="Korean">Korean</option>
            <option value="Japanese">Japanese</option>
            <option value="Chinese">Chinese</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
          </select>
        </div>

        <!-- Show Type Select -->
        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
          <label for="typeSelect" class="text-xs font-semibold text-slate-500">Type:</label>
          <select id="typeSelect" onchange="applyFiltersAndReload()" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
            <option value="ALL">All Types</option>
            <option value="Scripted">Scripted</option>
            <option value="Reality">Reality</option>
            <option value="Animation">Animation</option>
            <option value="Documentary">Documentary</option>
            <option value="Talk Show">Talk Show</option>
            <option value="Variety">Variety</option>
            <option value="News">News</option>
            <option value="Sports">Sports</option>
          </select>
        </div>

        <!-- Release Year Era Select -->
        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
          <label for="yearSelect" class="text-xs font-semibold text-slate-500">Era:</label>
          <select id="yearSelect" onchange="applyFiltersAndReload()" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
            <option value="ALL">All Eras</option>
            <option value="2020">2020 - Present</option>
            <option value="2010">2010 - 2019</option>
            <option value="2000">2000 - 2009</option>
            <option value="1990">1990 - 1999</option>
            <option value="OLDER">1989 & Older</option>
          </select>
        </div>

        <!-- Random Count Select -->
        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
          <label for="randomCountSelect" class="text-xs font-semibold text-slate-500">Random Count:</label>
          <select id="randomCountSelect" class="bg-transparent text-xs font-bold text-slate-700 focus:outline-none cursor-pointer">
            <option value="1">1x Show</option>
            <option value="3" selected>3x Shows</option>
            <option value="5">5x Shows</option>
            <option value="10">10x Shows</option>
          </select>
        </div>

        <!-- Random Show Button -->
        <button 
          onclick="fetchRandomShows()"
          class="bg-purple-600 hover:bg-purple-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm ml-auto">
          <i class="fa-solid fa-dice"></i> Random Show
        </button>
      </div>

      <!-- AUDIT TOGGLES BAR -->
      <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-4">
        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
          <input type="checkbox" id="onlyEmptyToggle" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 cursor-pointer">
          <span><i class="fa-solid fa-triangle-exclamation text-rose-500 mr-1"></i> Sadece Boş Kadrolar (Only Empty Cast)</span>
        </label>
        
        <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-700">
          <input type="checkbox" id="onlyMissingPhotosToggle" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500 cursor-pointer">
          <span><i class="fa-solid fa-image text-amber-500 mr-1"></i> Resim Eksik Olanlar (Missing Photos)</span>
        </label>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">
    <!-- TABS BAR -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
      <div class="flex items-center gap-2 bg-slate-200/70 p-1 rounded-xl">
        <button id="tabPopular" onclick="switchTab('popular')" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800">Popular Shows</button>
        <button id="tabNewlyAdded" onclick="switchTab('newlyAdded')" class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800">Newly Added</button>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <span id="resultsCount" class="text-xs font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-lg">0 shows</span>
        <button 
          id="exportListBtn"
          class="text-xs bg-slate-800 hover:bg-slate-700 text-white font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-file-export"></i> Export Issue List
        </button>
      </div>
    </div>

    <!-- SHOW CARDS GRID -->
    <div id="showsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Initial empty state rendered on load -->
    </div>
  </main>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg" class="text-xs font-medium">Notification</span>
  </div>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 text-center py-4 text-xs text-slate-500 mt-auto">
    <p>Data provided by <a href="https://www.tvmaze.com/api" target="_blank" rel="noopener noreferrer" class="underline hover:text-emerald-700">TVmaze API</a>. Tool built for database quality auditing.</p>
  </footer>

<!-- JAVASCRIPT LOGIC -->
<script>
  // State Variables
  let currentTab = null;
  let loadedShows = [];
  let checkedShows = getSafeCheckedShows();

  // Safe localStorage parser
  function getSafeCheckedShows() {
    try {
      const stored = localStorage.getItem('tvmaze_checked_shows');
      if (!stored) return {};
      const parsed = JSON.parse(stored);
      return typeof parsed === 'object' && parsed !== null ? parsed : {};
    } catch(e) {
      return {};
    }
  }

  // On Load Initializer - NO automatic search on open
  window.onload = function() {
    bindGlobalEvents();
    showInitialWelcomeState();
  };

  function showInitialWelcomeState() {
    const container = document.getElementById('showsContainer');
    document.getElementById('resultsCount').innerText = `0 shows`;
    
    // Reset tab highlights
    document.getElementById('tabPopular').className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800';
    document.getElementById('tabNewlyAdded').className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800';

    container.innerHTML = `
      <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-slate-200">
        <div class="bg-emerald-50 text-emerald-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <i class="fa-solid fa-magnifying-glass-chart text-2xl"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-800 mb-1">Ready to Audit TVmaze Cast Data</h2>
        <p class="text-slate-500 text-xs max-w-md mx-auto mb-6">
          Use the search bar above, click <span class="font-bold text-slate-700">Random Show</span>, or select a tab to begin inspecting show cast entries.
        </p>
        <div class="flex flex-wrap items-center justify-center gap-3">
          <button onclick="fetchRandomShows()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-dice"></i> Get Random Show
          </button>
          <button onclick="switchTab('popular')" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition">
            Browse Popular Shows
          </button>
        </div>
      </div>
    `;
  }

  // Bind Event Listeners safely without inline onclick execution
  function bindGlobalEvents() {
    document.getElementById('onlyEmptyToggle')?.addEventListener('change', handleFilterChange);
    document.getElementById('onlyMissingPhotosToggle')?.addEventListener('change', handleFilterChange);
    document.getElementById('exportListBtn')?.addEventListener('click', exportIssueList);
  }

  // Toast Notification System
  function showToast(msg, iconClass = "fa-circle-check text-emerald-400") {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    toastMsg.innerText = msg;
    toastIcon.className = `fa-solid ${iconClass}`;
    
    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
    }, 2500);
  }

  // Tab Switcher
  function switchTab(tab) {
    currentTab = tab;
    const popularBtn = document.getElementById('tabPopular');
    const newBtn = document.getElementById('tabNewlyAdded');

    if (tab === 'popular') {
      popularBtn.className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-700 bg-white shadow-sm';
      newBtn.className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800';
      fetchPopularShows();
    } else if (tab === 'newlyAdded') {
      newBtn.className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-700 bg-white shadow-sm';
      popularBtn.className = 'px-4 py-2 text-xs sm:text-sm font-semibold rounded-lg transition text-slate-500 hover:text-slate-800';
      fetchNewlyAddedShows();
    }
  }

  function applyFiltersAndReload() {
    if (currentTab === 'popular') fetchPopularShows();
    else if (currentTab === 'newlyAdded') fetchNewlyAddedShows();
    else handleFilterChange();
  }

  function handleFilterChange() {
    renderShowCards(loadedShows);
  }

  function showLoadingState(msg = 'Fetching data from TVmaze...') {
    const container = document.getElementById('showsContainer');
    container.innerHTML = `
      <div class="col-span-full text-center py-20 bg-white rounded-2xl border border-slate-200">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600 mb-3"></i>
        <p class="text-slate-600 font-medium text-sm">${escapeHtml(msg)}</p>
      </div>
    `;
  }

  function matchesSelectedYear(premieredDate) {
    const yearEl = document.getElementById('yearSelect');
    const selectedEra = yearEl ? yearEl.value : 'ALL';
    if (selectedEra === 'ALL') return true;
    if (!premieredDate) return false;

    const year = parseInt(premieredDate.substring(0, 4), 10);
    if (isNaN(year)) return false;

    if (selectedEra === '2020') return year >= 2020;
    if (selectedEra === '2010') return year >= 2010 && year <= 2019;
    if (selectedEra === '2000') return year >= 2000 && year <= 2009;
    if (selectedEra === '1990') return year >= 1990 && year <= 1999;
    if (selectedEra === 'OLDER') return year < 1990;
    return true;
  }

  function matchesSelectedType(showType) {
    const typeEl = document.getElementById('typeSelect');
    const selectedType = typeEl ? typeEl.value : 'ALL';
    if (selectedType === 'ALL') return true;
    return (showType || '').toLowerCase() === selectedType.toLowerCase();
  }

  function matchesSelectedLanguage(showLang) {
    const langEl = document.getElementById('langSelect');
    const selectedLang = langEl ? langEl.value : 'ALL';
    if (selectedLang === 'ALL') return true;
    return (showLang || '').toLowerCase() === selectedLang.toLowerCase();
  }

  async function fetchPopularShows() {
    showLoadingState("Loading popular TVmaze shows...");
    try {
      const response = await fetch('https://api.tvmaze.com/shows?page=0');
      if (!response.ok) throw new Error("Failed to fetch page 0");
      const data = await response.json();
      
      let filtered = data.filter(s => 
        matchesSelectedLanguage(s.language) &&
        matchesSelectedType(s.type) &&
        matchesSelectedYear(s.premiered)
      ).slice(0, 24);

      const fullShows = await Promise.all(filtered.map(async (show) => {
        try {
          const castRes = await fetch(`https://api.tvmaze.com/shows/${encodeURIComponent(show.id)}?embed=cast`);
          const castData = await castRes.json();
          return { ...show, cast: castData._embedded?.cast || [] };
        } catch(e) {
          return { ...show, cast: [] };
        }
      }));

      renderShowCards(fullShows);
    } catch (err) {
      console.error(err);
      showErrorState("Could not load popular shows.");
    }
  }

  async function fetchNewlyAddedShows() {
    showLoadingState("Checking newly updated entries...");
    try {
      const res = await fetch('https://api.tvmaze.com/updates/shows');
      const updates = await res.json();
      
      const recentIds = Object.keys(updates).slice(-40).reverse();
      const fetchedShows = [];

      for (const id of recentIds) {
        if (fetchedShows.length >= 18) break;
        try {
          const showRes = await fetch(`https://api.tvmaze.com/shows/${encodeURIComponent(id)}?embed=cast`);
          if (showRes.ok) {
            const show = await showRes.json();
            if (
              matchesSelectedLanguage(show.language) &&
              matchesSelectedType(show.type) &&
              matchesSelectedYear(show.premiered)
            ) {
              fetchedShows.push({
                ...show,
                cast: show._embedded?.cast || []
              });
            }
          }
        } catch(e) {}
      }

      renderShowCards(fetchedShows);
    } catch (err) {
      console.error(err);
      showErrorState("Could not load newly added shows.");
    }
  }

  async function fetchRandomShows() {
    const count = parseInt(document.getElementById('randomCountSelect').value, 10) || 3;
    showLoadingState(`Scanning TVmaze for ${count} random show(s)...`);

    const foundShows = [];
    let attempts = 0;
    const maxAttempts = 15;

    while (foundShows.length < count && attempts < maxAttempts) {
      attempts++;
      try {
        const randomPage = Math.floor(Math.random() * 250);
        const pageRes = await fetch(`https://api.tvmaze.com/shows?page=${randomPage}`);
        
        if (pageRes.status === 429) {
          await new Promise(r => setTimeout(r, 1000));
          continue;
        }

        if (pageRes.ok) {
          const showsOnPage = await pageRes.json();
          const shuffled = showsOnPage.sort(() => 0.5 - Math.random());
          
          for (const show of shuffled) {
            if (foundShows.length >= count) break;
            
            if (
              matchesSelectedLanguage(show.language) &&
              matchesSelectedType(show.type) &&
              matchesSelectedYear(show.premiered)
            ) {
              try {
                const castRes = await fetch(`https://api.tvmaze.com/shows/${encodeURIComponent(show.id)}?embed=cast`);
                if (castRes.ok) {
                  const fullShow = await castRes.json();
                  foundShows.push({
                    ...fullShow,
                    cast: fullShow._embedded?.cast || []
                  });
                }
              } catch (e) {
                foundShows.push({ ...show, cast: [] });
              }
            }
          }
        }
      } catch (e) {
        console.warn("Fetch attempt failed:", e);
      }
    }

    if (foundShows.length === 0) {
      showErrorState("No random show matched your filter criteria.");
    } else {
      renderShowCards(foundShows);
    }
  }

  async function executeSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    showLoadingState(`Searching TVmaze for "${query}"...`);
    try {
      const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
      const results = await res.json();
      
      const searchedShows = await Promise.all(results.map(async (item) => {
        const show = item.show;
        try {
          const castRes = await fetch(`https://api.tvmaze.com/shows/${encodeURIComponent(show.id)}?embed=cast`);
          const castData = await castRes.json();
          return { ...show, cast: castData._embedded?.cast || [] };
        } catch(e) {
          return { ...show, cast: [] };
        }
      }));

      const filtered = searchedShows.filter(s => 
        matchesSelectedLanguage(s.language) &&
        matchesSelectedType(s.type) &&
        matchesSelectedYear(s.premiered)
      );

      renderShowCards(filtered);
    } catch (err) {
      console.error(err);
      showErrorState("Error performing search.");
    }
  }

  function renderShowCards(shows) {
    loadedShows = shows;
    const container = document.getElementById('showsContainer');
    const onlyEmpty = document.getElementById('onlyEmptyToggle').checked;
    const onlyMissingPhotos = document.getElementById('onlyMissingPhotosToggle').checked;

    let filteredShows = shows.filter(show => {
      const isEmpty = !show.cast || show.cast.length === 0;
      const hasMissingPhotos = show.cast && show.cast.some(item => !item.character || !item.character.image);

      if (onlyEmpty && !isEmpty) return false;
      if (onlyMissingPhotos && !hasMissingPhotos) return false;
      return true;
    });

    document.getElementById('resultsCount').innerText = `${filteredShows.length} shows displayed`;

    if (filteredShows.length === 0) {
      container.innerHTML = `
        <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-slate-200 text-slate-400">
          <i class="fa-solid fa-filter-circle-xmark text-4xl mb-3 opacity-40"></i>
          <p class="text-sm font-medium">No shows match the selected filter criteria.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = filteredShows.map(show => {
      const safeId = parseInt(show.id, 10);
      const isEmpty = !show.cast || show.cast.length === 0;
      const missingPhotoCount = show.cast ? show.cast.filter(item => !item.character || !item.character.image).length : 0;
      const isChecked = !!checkedShows[safeId];
      const tvmazeUrl = `https://www.tvmaze.com/shows/${safeId}`;
      const posterUrl = show.image?.medium ? escapeHtml(show.image.medium) : 'https://placehold.co/210x295/cbd5e1/475569?text=No+Cover';

      let statusBadge = '';
      if (isEmpty) {
        statusBadge = `<span class="bg-rose-100 text-rose-800 text-xs px-2 py-0.5 rounded font-bold border border-rose-200"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Empty Cast</span>`;
      } else if (missingPhotoCount > 0) {
        statusBadge = `<span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded font-bold border border-amber-200"><i class="fa-solid fa-image mr-1"></i>${missingPhotoCount} Missing Photo(s)</span>`;
      } else {
        statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-bold border border-emerald-200"><i class="fa-solid fa-check mr-1"></i>Complete (${show.cast.length})</span>`;
      }

      return `
        <div class="p-4 rounded-xl border ${isChecked ? 'bg-emerald-50/60 border-emerald-300' : 'bg-white border-slate-200'} shadow-sm flex gap-4 transition hover:shadow-md">
          <img src="${posterUrl}" alt="${escapeHtml(show.name)}" class="w-24 h-36 object-cover rounded-lg bg-slate-200 shrink-0" />
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-2 mb-1">
                <h3 class="font-bold text-slate-900 text-base leading-tight">${escapeHtml(show.name)}</h3>
                <button 
                  data-show-id="${safeId}"
                  class="mark-btn text-xs px-2 py-1 rounded-lg font-semibold transition shrink-0 ${isChecked ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                  <i class="fa-solid ${isChecked ? 'fa-circle-check' : 'fa-circle'} mr-1"></i>
                  ${isChecked ? 'Checked' : 'Mark Done'}
                </button>
              </div>
              
              <div class="flex flex-wrap gap-1.5 my-2">
                ${statusBadge}
                <span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-medium">${escapeHtml(show.language || 'Unknown')}</span>
                <span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-medium">${escapeHtml(show.type || 'Scripted')}</span>
                ${show.premiered ? `<span class="bg-slate-100 text-slate-600 text-xs px-2 py-0.5 rounded font-medium">${escapeHtml(show.premiered.substring(0,4))}</span>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
              <a href="${escapeHtml(tvmazeUrl)}" target="_blank" rel="noopener noreferrer" class="text-xs text-emerald-700 font-semibold hover:underline flex items-center gap-1">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> View on TVmaze
              </a>
              <button 
                data-copy-url="${escapeHtml(tvmazeUrl)}"
                class="copy-btn text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded-lg font-medium transition flex items-center gap-1 ml-auto">
                <i class="fa-solid fa-copy"></i> Copy Link
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Attach safe event handlers to dynamic cards
    container.querySelectorAll('.mark-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.currentTarget.getAttribute('data-show-id');
        toggleShowChecked(id);
      });
    });

    container.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const url = e.currentTarget.getAttribute('data-copy-url');
        handleCopyClick(e.currentTarget, url);
      });
    });
  }

  function toggleShowChecked(showId) {
    const id = parseInt(showId, 10);
    if (isNaN(id)) return;

    checkedShows[id] = !checkedShows[id];
    if (!checkedShows[id]) {
      delete checkedShows[id];
    }
    
    try {
      localStorage.setItem('tvmaze_checked_shows', JSON.stringify(checkedShows));
    } catch(e) {}
    
    renderShowCards(loadedShows);
  }

  function handleCopyClick(btn, url) {
    copyTextToClipboard(url);
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i class="fa-solid fa-check text-emerald-600"></i> Copied!`;
    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
  }

  function exportIssueList() {
    const issueShows = loadedShows.filter(show => {
      const isEmpty = !show.cast || show.cast.length === 0;
      const hasMissingPhotos = show.cast && show.cast.some(item => !item.character || !item.character.image);
      return isEmpty || hasMissingPhotos;
    });

    if (issueShows.length === 0) {
      showToast("No issues found in the currently displayed list.", "fa-circle-info text-amber-400");
      return;
    }

    const textLines = issueShows.map(show => {
      const isEmpty = !show.cast || show.cast.length === 0;
      const missingPhotoCount = show.cast ? show.cast.filter(item => !item.character || !item.character.image).length : 0;
      let issueLabel = isEmpty ? '[EMPTY CAST]' : `[${missingPhotoCount} MISSING PHOTO(S)]`;
      return `${show.name} - ${issueLabel}: https://www.tvmaze.com/shows/${show.id}`;
    });

    copyTextToClipboard(textLines.join('\n'));
    showToast("Issue list copied to clipboard!", "fa-circle-check text-emerald-400");
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const tempArea = document.createElement('textarea');
    tempArea.value = text;
    tempArea.style.position = 'fixed';
    tempArea.style.opacity = '0';
    document.body.appendChild(tempArea);
    tempArea.select();
    
    try {
      document.execCommand('copy');
    } catch (err) {
      console.error('Failed to copy', err);
    } finally {
      document.body.removeChild(tempArea);
    }
  }

  function showErrorState(msg) {
    const container = document.getElementById('showsContainer');
    container.innerHTML = `
      <div class="col-span-full text-center py-16 bg-white rounded-2xl border border-slate-200 text-rose-500">
        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
        <p class="text-sm font-medium">${escapeHtml(msg)}</p>
      </div>
    `;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
